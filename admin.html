<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>APRP Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050a17;--bg2:#0a1124;--card:#0b1328;--line:#18233d;--tx:#f1f5fb;--mut:#8b9ab5;--g:#10b981;--g2:#34d399;--gd:#06402f;--bad:#f43f5e;--warn:#fbbf24;--pri:#10b981}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:15px/1.45 "Roboto",system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:50px}
.top{position:sticky;top:0;z-index:6;background:linear-gradient(180deg,#060d1f,#050a17);border-bottom:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#10b981,#06b6d4);color:#031a14;font-weight:800;display:grid;place-items:center;font-size:18px}
.top b{font-size:17px;flex:1}
.ib{background:#0d1730;border:1px solid var(--line);color:var(--tx);border-radius:11px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;position:relative}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--g)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 4px;max-width:760px;margin:auto}
.bar span{font:600 13px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.04em;color:var(--tx);text-transform:uppercase}
.bar button{background:#111c36;color:var(--tx);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:14px}
main{padding:10px 14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.hero{background:radial-gradient(120% 140% at 0% 0%,#0c2a2a 0%,var(--card) 55%);padding:20px}
.hero small{font:600 12px ui-monospace,Menlo,monospace;color:var(--g2);letter-spacing:.05em;text-transform:uppercase}
.hero h1{font-size:25px;line-height:1.15;margin:8px 0}
.hero p{color:var(--mut);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}
.stat .t{color:var(--mut);font-size:14px;display:flex;justify-content:space-between;gap:6px}
.stat b{display:block;font-size:26px;margin:8px 0 4px;letter-spacing:.01em}
.stat b.g{color:var(--g2)}
.stat span.s{font-size:13px;color:var(--mut)}.stat span.w{font-size:13px;color:var(--warn)}
.alert{background:#1a1408;border:1px solid #5c4410;color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;background:#17233f;color:var(--mut);font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.tag.pending,.tag.holding,.tag.sell_requested,.tag.shipped,.tag.under_review{background:#2e2409;color:var(--warn)}
.tag.approved,.tag.completed,.tag.verified,.tag.delivered,.tag.sold,.tag.active{background:#06301f;color:var(--g2)}
.tag.rejected,.tag.cancelled,.tag.suspended,.tag.blocked,.tag.reversed{background:#35101a;color:var(--bad)}
button.b,a.b{display:inline-block;background:var(--g);color:#032016;font-weight:600;border:0;border-radius:12px;padding:10px 15px;font-size:14px;text-decoration:none}
button.b.ok{background:var(--g);color:#032016}button.b.no{background:#2a0f18;color:#fb7185;border:1px solid #5b1a2a}button.b.gh{background:#111c36;color:var(--tx);font-weight:500;border:1px solid var(--line)}
button.b:disabled{opacity:.5}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input,select,textarea{width:100%;background:#060c1c;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;margin:4px 0 10px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--g)}
label{font-size:13px;color:var(--mut)}
h2{font-size:18px;margin:6px 0 10px}
.seg{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.seg button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:11px;padding:8px 13px}
.seg button.on{color:var(--g2);border-color:var(--g);background:#071f1a}
.ov{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#12203d;border:1px solid var(--line);padding:11px 17px;border-radius:13px;z-index:40;max-width:90%}
.toast.err{background:#35101a;border-color:#5b1a2a}
.imgs img{width:100%;border-radius:12px;margin-top:8px;background:#000}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#16213a}
.kv{display:grid;grid-template-columns:105px 1fr;gap:4px 8px;font-size:14px}.kv span:nth-child(odd){color:var(--mut)}
.center{max-width:390px;margin:9vh auto;padding:0 18px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#08101f;border-radius:15px;padding:11px;margin-bottom:10px}
.tx .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.tx .ic.in{background:#06301f;color:var(--g2)}.tx .ic.out{background:#35101a;color:var(--bad)}.tx .ic.shop{background:#2e2409;color:var(--warn)}
.tx .m{flex:1;min-width:0}.tx .m b{display:block}.tx .m span{font:12px ui-monospace,Menlo,monospace;color:var(--mut)}
.tx .a{text-align:right}.tx .a b{display:block}
.menu{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:0 14px 40px}
.menu h3{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.07em;color:var(--mut);text-transform:uppercase;margin:22px 8px 8px}
.menu button.it{display:flex;width:100%;align-items:center;gap:13px;background:none;border:1px solid transparent;color:var(--mut);font-size:16px;padding:13px 12px;border-radius:13px;text-align:left}
.menu button.it.on{background:#071f1a;border-color:#0b5b43;color:var(--g2);font-weight:600}
.menu button.it em{margin-left:auto;font-style:normal;background:var(--bad);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px}
.qr{background:#fff;border-radius:14px;padding:10px;width:220px;margin:8px auto;display:block}
.sec{font:15px ui-monospace,Menlo,monospace;background:#060c1c;border:1px dashed var(--g);border-radius:12px;padding:11px;word-break:break-all;text-align:center;margin:6px 0}
.ck{display:flex;align-items:center;gap:9px;margin:8px 0;color:var(--tx);font-size:14px}.ck input{width:auto;margin:0}
.code{font-size:26px;letter-spacing:.35em;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const SUPABASE_URL="https://hdlskefeuodhoeaksflq.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_wls_WZ6wbLt32s_XRDu9Ug_VndX5ItE";
/* The admin sign-in is kept only in memory: closing or reloading the page signs you out,
   and it is never shared with the customer app. */
const memStore={};
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{
  storageKey:"aprp-admin-auth",persistSession:false,autoRefreshToken:true,detectSessionInUrl:false,
  storage:{getItem:k=>memStore[k]??null,setItem:(k,v)=>{memStore[k]=v},removeItem:k=>{delete memStore[k]}}}}) : null;
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"৳"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const when=t=>t?new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
let me=null, stats={}, page="home", names={};

function toast(m,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
async function call(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error)throw error;return data}
async function guard(fn,btn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message||String(e),true)}finally{if(btn)btn.disabled=false}}
let ovCount=0,ignorePop=0;
function ovPush(){history.pushState({ov:1},"");ovCount++}
function ovClosed(){if(ovCount>0){ovCount--;ignorePop++;history.back()}}
function sheet(html){const had=$("#ov");if(had)had.remove();else ovPush();const o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML='<div class="sheet">'+html+'</div>';o.addEventListener("click",e=>{if(e.target===o)closeSheet()});document.body.appendChild(o);return o.firstChild}
function closeSheet(){const o=$("#ov");if(o){o.remove();ovClosed()}}
function ask(title,withNote,cb,label){
  const s=sheet('<h2>'+esc(title)+'</h2>'+(withNote?'<label>Note (optional)</label><textarea id="nt" rows="2"></textarea>':'')+'<div class="acts"><button class="b" id="yes">'+(label||"Confirm")+'</button><button class="b gh" id="no">Cancel</button></div>');
  s.querySelector("#no").onclick=closeSheet;
  s.querySelector("#yes").onclick=e=>guard(async()=>{await cb(withNote?s.querySelector("#nt").value:null);closeSheet()},e.target);
}
async function loadNames(ids){
  ids=[...new Set(ids.filter(i=>i&&!names[i]))];if(!ids.length)return;
  const {data}=await sb.from("account_profiles").select("user_id,username,phone").in("user_id",ids);
  (data||[]).forEach(r=>names[r.user_id]=r.username+(r.phone?" · "+r.phone:""));
}
const nm=id=>esc(names[id]||String(id||"").slice(0,8));

/* ---------- sign-in: password, then Google Authenticator ---------- */
function authShell(inner){$("#app").innerHTML='<div class="center"><div class="logo" style="width:54px;height:54px;font-size:26px;margin-bottom:14px">A</div><h2 style="font-size:26px;margin:0 0 4px">APRP Admin</h2>'+inner+'</div>'}
function loginView(msg){
  authShell('<p class="mut" style="margin:0 0 18px">Sign in to continue</p><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="b" style="width:100%" id="go">Sign in</button><p class="mut" id="msg" style="color:#fb7185">'+esc(msg||"")+'</p>');
  $("#pw").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
  $("#go").onclick=e=>guard(async()=>{
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error)throw error;await afterPassword();
  },e.target);
}
async function afterPassword(){
  let info;
  try{info=await call("admin_me")}catch(e){await signOut("Could not check your account.");return}
  if(!info||!info.staff){await signOut("This account is not allowed here.");return}
  const {data:lf}=await sb.auth.mfa.listFactors();
  const verified=(lf&&lf.totp||[]).filter(f=>f.status==="verified");
  const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal&&aal.currentLevel==="aal2"){me=await call("admin_me");if(me.aal==="aal2"){shell();return}}
  if(verified.length)codeView(verified[0].id);else await enrollView(lf);
}
function codeView(factorId,msg){
  authShell('<p class="mut" style="margin:0 0 14px">Open Google Authenticator and enter the 6-digit code for <b>APRP Admin</b>.</p><input id="cd" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"><button class="b" style="width:100%" id="vf">Verify</button><p class="mut" style="color:#fb7185">'+esc(msg||"")+'</p><button class="b gh" id="so" style="width:100%">Cancel</button>');
  $("#so").onclick=()=>signOut();
  $("#cd").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"");if(e.target.value.length===6)$("#vf").click()};
  $("#vf").onclick=e=>guard(async()=>{
    const code=$("#cd").value.trim();if(code.length!==6)throw new Error("Enter the 6-digit code.");
    const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId});if(e1)throw e1;
    const {error:e2}=await sb.auth.mfa.verify({factorId,challengeId:ch.id,code});
    if(e2){codeView(factorId,"Wrong code. Try the newest code.");return}
    me=await call("admin_me");if(me.aal!=="aal2")throw new Error("Verification did not complete.");shell();
  },e.target);
}
async function enrollView(lf){
  for(const f of (lf&&lf.all||[]).filter(f=>f.status!=="verified")){try{await sb.auth.mfa.unenroll({factorId:f.id})}catch(_){}}
  const {data,error}=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"APRP Admin "+Date.now().toString(36),issuer:"APRP Admin"});
  if(error){await signOut("Could not start authenticator setup: "+error.message+" (In Supabase: Authentication → Sign In / Providers → Multi-Factor → enable TOTP.)");return}
  const secret=data.totp.secret, uri=data.totp.uri;
  authShell('<p class="mut" style="margin:0 0 10px">One-time setup. Add this account to <b>Google Authenticator</b>:</p>'+
   '<a class="b" style="display:block;text-align:center" href="'+esc(uri)+'">Open in Google Authenticator</a>'+
   '<p class="mut" style="margin:14px 0 4px">If that does not open the app: in Authenticator tap + → Enter a setup key, and type this key:</p><div class="sec" id="sk">'+esc(secret)+'</div>'+
   '<button class="b gh" id="cp" style="width:100%;margin-bottom:12px">Copy key</button>'+
   '<img class="qr" alt="" src="'+esc(data.totp.qr_code)+'">'+
   '<label>Then enter the 6-digit code it shows</label><input id="cd" class="code" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="b" style="width:100%" id="vf">Finish setup</button><p class="mut" id="msg" style="color:#fb7185"></p><button class="b gh" id="so" style="width:100%">Cancel</button>');
  $("#so").onclick=()=>signOut();
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(secret);toast("Copied")}catch(_){toast("Copy the key by long-press",true)}};
  $("#cd").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"")};
  $("#vf").onclick=e=>guard(async()=>{
    const code=$("#cd").value.trim();if(code.length!==6)throw new Error("Enter the 6-digit code.");
    const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId:data.id});if(e1)throw e1;
    const {error:e2}=await sb.auth.mfa.verify({factorId:data.id,challengeId:ch.id,code});
    if(e2)throw new Error("Wrong code. Check the key and try again.");
    me=await call("admin_me");if(me.aal!=="aal2")throw new Error("Verification did not complete.");shell();
  },e.target);
}
window.addEventListener("popstate",e=>{
  if(ignorePop>0){ignorePop--;return}
  const mn=$("#menu");if(mn){mn.remove();ovCount=Math.max(0,ovCount-1);return}
  const ov=$("#ov");if(ov){ov.remove();ovCount=Math.max(0,ovCount-1);return}
  if(me&&e.state&&e.state.p&&e.state.p!==page)go(e.state.p,true);
});
async function signOut(msg){const a=$("#menu");if(a)a.remove();const b=$("#ov");if(b)b.remove();ovCount=0;try{await sb.auth.signOut()}catch(_){}me=null;stats={};loginView(msg)}
async function boot(){
  if(!sb){authShell('<p class="mut">Could not load the app library. Check your internet.</p>');return}
  loginView();
}

/* ---------- idle sign-out (10 minutes) ---------- */
let idleT;function idleReset(){clearTimeout(idleT);if(me)idleT=setTimeout(()=>signOut("Signed out after 10 minutes without activity."),600000)}
["click","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,idleReset,{passive:true}));

/* ---------- shell and menu ---------- */
const MENU=[
 ["Overview",[["home","▦","Dashboard",()=>true]]],
 ["Financial operations",[["deposits","⇣","Deposits",()=>me.finance],["withdrawals","⇡","Withdrawals",()=>me.finance],["ledger","≡","Transactions & Ledger",()=>me.finance||me.admin]]],
 ["Commerce",[["products","▣","Products & Catalog",()=>me.content],["orders","⚑","Orders & Buyback",()=>me.orders||me.finance],["reviews","★","Product Reviews",()=>me.content]]],
 ["Users & community",[["users","☺","User Management",()=>me.admin||me.finance||me.kyc],["kyc","✔","KYC Verification",()=>me.kyc],["referral","✦","Referral & Commission",()=>me.admin],["updates","✎","Updates (posts)",()=>me.content]]],
 ["Administration",[["channels","⇄","Payment Channels",()=>me.admin],["shop","⚙","Shop Settings",()=>me.admin],["logs","⛨","Security & Audit Logs",()=>me.admin]]]
];
const TITLE={};MENU.forEach(g=>g[1].forEach(i=>TITLE[i[0]]=i[2]));
const badge=()=>({deposits:stats.pending_deposits,withdrawals:stats.pending_withdrawals,kyc:stats.pending_kyc,orders:(stats.pending_orders||0)+(stats.sell_requests||0)});
async function refreshStats(){try{stats=await call("admin_stats")}catch(e){stats={}}}
function shell(){
  idleReset();
  $("#app").innerHTML='<div class="top"><div class="logo">A</div><b>APRP Admin</b><button class="ib" id="bl" style="width:auto;padding:0 13px;font-size:14px">Sign out</button></div><div class="bar"><span id="ttl"></span><button id="mm">☰ Modules</button></div><main id="main"></main>';
  $("#bl").onclick=()=>signOut();$("#mm").onclick=openMenu;
  page="home";history.replaceState({p:"home"},"","#home");
  go("home",true);
}
function openMenu(){
  const b=badge();
  const m=document.createElement("div");m.className="menu";m.id="menu";
  m.innerHTML='<div class="bar" style="padding:14px 0 0"><span>Admin screen: '+esc(TITLE[page]||"")+'</span><button id="cm">✕ Close</button></div>'+
   MENU.map(g=>{const its=g[1].filter(i=>i[3]());if(!its.length)return"";return'<h3>'+g[0]+'</h3>'+its.map(i=>'<button class="it '+(i[0]===page?"on":"")+'" data-p="'+i[0]+'"><span style="width:20px;text-align:center">'+i[1]+'</span>'+i[2]+(b[i[0]]?'<em>'+b[i[0]]+'</em>':"")+'</button>').join("")}).join("");
  document.body.appendChild(m);ovPush();
  m.querySelector("#cm").onclick=()=>{m.remove();ovClosed()};
  m.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{
    const t=x.dataset.p;m.remove();ovCount--;
    if(t===page){ignorePop++;history.back();return}
    history.replaceState({p:t},"","#"+t);go(t,true);
  });
}
async function go(p,noPush){
  if(!noPush&&p!==page)history.pushState({p},"","#"+p);
  page=p;idleReset();await refreshStats();
  $("#ttl").textContent="Admin screen: "+(TITLE[p]||"");
  const m=$("#main");m.innerHTML='<p class="mut">Loading…</p>';
  window.scrollTo(0,0);
  try{await views[p](m)}catch(e){m.innerHTML='<div class="card">'+esc(e.message||e)+'</div>'}
}
const views={};

/* ---------- dashboard ---------- */
views.home=async m=>{
  const s=stats;
  let h='<div class="card hero"><small>Central ledger &amp; engine: operational</small><h1>Executive Financial &amp; Operational Console</h1><p>Deposits, withdrawals, shop orders, buyback and users in one place.</p></div>';
  h+='<div class="grid">'+
   '<div class="stat"><div class="t">Users’ main balance <span>◧</span></div><b>'+money(s.total_available)+'</b><span class="s">'+(s.users||0)+' registered accounts</span></div>'+
   '<div class="stat"><div class="t">Reserved (buyback) <span>◷</span></div><b class="g">'+money(s.total_reserved)+'</b><span class="s">held in buyback products</span></div>'+
   '<div class="stat"><div class="t">Pending deposits <span style="color:var(--g2)">⇣</span></div><b>'+(s.pending_deposits||0)+'</b><span class="'+(s.pending_deposits?"w":"s")+'">'+(s.pending_deposits?"Needs review":"All clear")+'</span></div>'+
   '<div class="stat"><div class="t">Pending withdrawals <span style="color:var(--bad)">⇡</span></div><b>'+(s.pending_withdrawals||0)+'</b><span class="'+(s.pending_withdrawals?"w":"s")+'">'+(s.pending_withdrawals?"Needs payment":"All clear")+'</span></div>'+
   '<div class="stat"><div class="t">Pending KYC <span>✔</span></div><b>'+(s.pending_kyc||0)+'</b><span class="s">identity checks</span></div>'+
   '<div class="stat"><div class="t">Orders &amp; sell requests <span>⚑</span></div><b>'+((s.pending_orders||0)+(s.sell_requests||0))+'</b><span class="s">'+(s.pending_orders||0)+' delivery · '+(s.sell_requests||0)+' sell</span></div>'+
  '</div>';
  m.innerHTML=h;
  if(me.finance||me.admin){
    const box=document.createElement("div");box.className="card";box.innerHTML='<div class="row"><h2 style="margin:0">Central Ledger Transactions</h2><a class="mut" href="#" id="vl" style="color:var(--g2)">View full ledger →</a></div><div style="margin-top:12px" id="lg"></div>';
    m.appendChild(box);$("#vl").onclick=e=>{e.preventDefault();go("ledger")};
    await ledgerRows($("#lg"),6);
  }
};
async function ledgerRows(el,n){
  const {data,error}=await sb.from("transactions").select("transaction_id,user_id,transaction_type,status,amount,created_at").order("created_at",{ascending:false}).limit(n);
  if(error){el.innerHTML='<p class="mut">'+esc(error.message)+'</p>';return}
  await loadNames(data.map(r=>r.user_id));
  if(!data.length){el.innerHTML='<p class="mut">No transactions yet.</p>';return}
  el.innerHTML=data.map(r=>{

let cats=[];
async function shrink(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  const k=Math.min(1,1100/Math.max(img.width,img.height));
  const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
  return await new Promise(ok=>cv.toBlob(ok,"image/jpeg",.85));
}
async function uploadImg(file){
  const blob=await shrink(file);
  const path=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+".jpg";
  const {error}=await sb.storage.from("product-images").upload(path,blob,{contentType:"image/jpeg"});
  if(error)throw error;
  return sb.storage.from("product-images").getPublicUrl(path).data.publicUrl;
}

  '<label>Main image</label><div id="f_mainbox"></div><input id="f_mainfile" type="file" accept="image/*">'+
  '<label>More images</label><div id="f_exbox"></div><input id="f_exfile" type="file" accept="image/*" multiple>'+
  '<label class="ck"><input id="f_act" type="checkbox" '+(p.active===false?"":"checked")+'>Visible in shop</label>'+
  '<div class="acts"><button class="b" id="sv">Save</button><button class="b gh" id="cx">Close</button>'+(p.id?'<button class="b no" id="dl">Delete</button>':"")+'</div>');
  const q=i=>s.querySelector("#"+i);
  const calc=()=>{const op=+q("f_op").value||0,dp=+q("f_dp").value||0,bp=+q("f_bp").value||0,bd=+q("f_bd").value||7;const pr=op*(100-dp)/100;
    q("f_calc").innerHTML='Customer pays <b>'+money(pr)+'</b><br>'+(bp>0?'Buyback after '+bd+' days: <b>'+money(pr*(100+bp)/100)+'</b> · early sale (60% default): '+money(pr*.6):'No buyback')};
  ["f_op","f_dp","f_bp","f_bd"].forEach(i=>q(i).oninput=calc);calc();

function updateForm(u,ps){
  u=u||{};let img=u.image_url||"";
  const s=sheet('<h2>'+(u.id?"Edit update":"New update")+'</h2>'+
   '<label>Type</label><select id="u_k">'+Object.keys(KINDS).map(k=>'<option value="'+k+'"'+((u.kind||"notice")===k?" selected":"")+'>'+KINDS[k]+'</option>').join("")+'</select>'+
   '<label>Title</label><input id="u_t" maxlength="120" value="'+esc(u.title||"")+'">'+
   '<label>Message</label><textarea id="u_b" rows="5">'+esc(u.body||"")+'</textarea>'+
   '<label>Image (optional)</label><div id="u_ib"></div><input id="u_if" type="file" accept="image/*">'+
   '<label>Link to a product (optional)</label><select id="u_p"><option value="">—</option>'+ps.map(p=>'<option value="'+p.id+'"'+(p.id===u.product_id?" selected":"")+'>'+esc(p.name)+'</option>').join("")+'</select>'+
   '<label class="ck"><input id="u_pin" type="checkbox" '+(u.pinned?"checked":"")+'>Pin to the top</label>'+
   '<label class="ck"><input id="u_ac" type="checkbox" '+(u.active===false?"":"checked")+'>Visible to customers</label>'+
   '<div class="acts"><button class="b" id="u_sv">Save</button><button class="b gh" id="u_cx">Close</button>'+(u.id?'<button class="b no" id="u_dl">Delete</button>':"")+'</div>');
  const q=i=>s.querySelector("#"+i);
  const draw=()=>{q("u_ib").innerHTML=img?'<img class="thumb" src="'+esc(img)+'"> <button class="b gh" id="u_rm" type="button">Remove</button>':'<span class="mut">none</span>';const r=q("u_rm");if(r)r.onclick=()=>{img="";draw()}};draw();
  q("u_if").onchange=e=>guard(async()=>{if(e.target.files[0]){img=await uploadImg(e.target.files[0]);draw()}});
  q("u_cx").onclick=closeSheet;
  q("u_sv").onclick=e=>guard(async()=>{
    const row={kind:q("u_k").value,title:q("u_t").value.trim(),body:q("u_b").value.trim()||null,image_url:img||null,product_id:q("u_p").value||null,pinned:q("u_pin").checked,active:q("u_ac").checked,updated_at:new Date().toISOString()};
    if(!row.title)throw new Error("Enter a title.");
    const r=u.id?await sb.from("app_updates").update(row).eq("id",u.id):await sb.from("app_updates").insert(row);
    if(r.error)throw r.error;closeSheet();toast("Saved");go("updates");
  },e.target);
  if(u.id)q("u_dl").onclick=()=>ask("Delete this update?",false,async()=>{const r=await sb.from("app_updates").delete().eq("id",u.id);if(r.error)throw r.error;toast("Deleted");go("updates")},"Delete");
}

/* ---------- product reviews (admin can delete) ---------- */
views.reviews=async m=>{
  const {data,error}=await sb.from("shop_reviews").select("*").order("created_at",{ascending:false}).limit(80);
  if(error)throw error;
  await loadNames(data.map(r=>r.user_id));
  const ids=[...new Set(data.map(r=>r.product_id))];
  const pn={};
  if(ids.length){const {data:ps}=await sb.from("shop_products").select("id,name").in("id",ids);(ps||[]).forEach(p=>pn[p.id]=p.name)}
  m.innerHTML=data.length?"":'<p class="mut">No reviews yet.</p>';
  data.forEach(r=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML='<div class="row"><b>'+esc(pn[r.product_id]||"Product")+'</b><span style="color:var(--warn)">'+"★".repeat(r.rating)+"☆".repeat(5-r.rating)+'</span></div><div class="mut">'+nm(r.user_id)+' · '+when(r.created_at)+'</div>'+(r.comment?'<div style="margin-top:8px">'+esc(r.comment)+'</div>':"")+((r.images||[]).length?'<div class="imgs" style="display:flex;gap:8px;flex-wrap:wrap">'+r.images.map(u=>'<img src="'+esc(u)+'" style="width:70px;height:70px;object-fit:cover;margin:6px 0 0">').join("")+'</div>':"")+'<div class="acts"><button class="b no">Delete review</button></div>';
    c.querySelector("button").onclick=()=>ask("Delete this review?",false,async()=>{await call("admin_delete_review",{p_id:r.id});toast("Deleted");go("reviews")},"Delete");
    m.appendChild(c);
  });
};

/* ---------- settings pages ---------- */
views.shop=async m=>{
  const {data:ss,error}=await sb.from("shop_settings").select("*").eq("id",1).single();if(error)throw error;
  m.innerHTML='<div class="card"><label>Early-sale payout (% of price paid)</label><input id="s_ep" type="number" value="'+ss.early_percent+'"><label>Delivery charge (৳)</label><input id="s_dc" type="number" value="'+ss.delivery_charge+'"><label>Delivery time (days, e.g. 12-15)</label><input id="s_dd" value="'+esc(ss.delivery_days)+'"><label>Support link (Telegram or website, https://…)</label><input id="s_su" value="'+esc(ss.support_url||"")+'"><button class="b" id="s_sv">Save</button></div>';
  $("#s_sv").onclick=e=>guard(async()=>{const r=await sb.from("shop_settings").update({early_percent:+$("#s_ep").value,delivery_charge:+$("#s_dc").value,delivery_days:$("#s_dd").value.trim()||"12-15",support_url:$("#s_su").value.trim()||null,updated_at:new Date().toISOString()}).eq("id",1);if(r.error)throw r.error;toast("Saved")},e.target);
};
views.referral=async m=>{
  const ref=await call("admin_referral_overview");
  m.innerHTML='<div class="card"><div class="mut">Referrals '+ref.total+' · pending '+ref.pending+' · earned '+ref.earned+' · paid '+money(ref.paid)+'</div><label style="display:block;margin-top:12px">Commission per referral (৳)</label><select id="r_rt">'+[50,100,150,200].map(v=>'<option'+(+ref.rate===v?" selected":"")+'>'+v+'</option>').join("")+'</select><label>Minimum total purchases of the referred user (৳)</label><input id="r_mn" type="number" value="'+ref.min_total+'"><button class="b" id="r_sv">Save</button></div>';
  $("#r_sv").onclick=e=>guard(async()=>{await call("admin_set_referral_rate",{new_rate:+$("#r_rt").value,new_min:+$("#r_mn").value});toast("Saved")},e.target);
};
views.channels=async m=>{
  const [{data:svc,error:e2},{data:chs,error:e3},{data:pv},{data:accs,error:e4}]=await Promise.all([
    sb.from("provider_services").select("id,provider_id,service_code,service_name,available,status,minimum_amount,maximum_amount,fixed_fee,percentage_fee,description"),
    sb.from("provider_channels").select("id,provider_service_id,channel_name,channel_type,notes,available,status,minimum_amount,maximum_amount"),
    sb.from("providers").select("id,name"),
    sb.from("channel_accounts").select("*").order("created_at")]);
  if(e2)throw e2;if(e3)throw e3;
  const pn={};(pv||[]).forEach(p=>pn[p.id]=p.name);
  const accounts=e4?[]:(accs||[]);
  m.innerHTML='<p class="mut" style="margin:0 0 12px">Turn methods on or off, set limits and fees, and add the number customers send money to.</p><div id="chl"></div>';
  const L=$("#chl");
  if(!svc.length)L.innerHTML='<div class="card">No payment services found.</div>';
  svc.forEach(s=>{
    const isDep=s.service_code==="deposit";
    const card=document.createElement("div");card.className="card";
    card.innerHTML='<div class="row"><div><b>'+esc(pn[s.provider_id]||"")+' '+esc(s.service_name||s.service_code)+'</b><div class="mut">'+esc(s.service_code)+' · min '+money(s.minimum_amount)+(s.maximum_amount?' · max '+money(s.maximum_amount):"")+' · fee '+money(s.fixed_fee)+' + '+(+s.percentage_fee||0)+'%</div></div><button class="b '+(s.available?"ok":"gh")+'" data-t="1">'+(s.available?"ON":"OFF")+'</button></div><div class="acts"><button class="b gh" data-e="1">Edit rules</button><button class="b gh" data-a="1">+ Add channel</button></div><div class="chs"></div>';
    card.querySelector("[data-t]").onclick=e=>guard(async()=>{await call("admin_set_channel",{p_kind:"service",p_id:s.id,p_available:!s.available});go("channels")},e.target);
    card.querySelector("[data-e]").onclick=()=>serviceForm(s);
    card.querySelector("[data-a]").onclick=()=>channelForm(null,s);
    const box=card.querySelector(".chs");
    chs.filter(c=>c.provider_service_id===s.id).forEach(c=>{
      const mine=accounts.filter(a=>a.channel_id===c.id);
      const r=document.createElement("div");r.className="sw";r.style.cssText="flex-wrap:wrap;gap:8px";
      r.innerHTML='<span style="flex:1;min-width:140px"><b>'+esc(c.channel_name)+'</b><br><span class="mut">'+esc(c.channel_type||"")+(c.notes?" · "+esc(c.notes).slice(0,60):"")+'</span></span><span style="display:flex;gap:6px"><button class="b gh" data-ed="1">Edit</button>'+(isDep?'<button class="b gh" data-nm="1">Numbers ('+mine.filter(a=>a.active).length+')</button>':"")+'<button class="b '+(c.available?"ok":"gh")+'" data-ct="1">'+(c.available?"ON":"OFF")+'</button></span>';
      r.querySelector("[data-ed]").onclick=()=>channelForm(c,s);
      const nb=r.querySelector("[data-nm]");if(nb)nb.onclick=()=>accountsSheet(c,accounts,e4);
      r.querySelector("[data-ct]").onclick=e=>guard(async()=>{await call("admin_set_channel",{p_kind:"channel",p_id:c.id,p_available:!c.available});go("channels")},e.target);
      box.appendChild(r);
    });
    L.appendChild(card);
  });
};
const num=v=>v===""||v==null?null:Number(v);
function serviceForm(s){
  const sh=sheet('<h2>Edit rules</h2><div class="grid"><div><label>Minimum (৳)</label><input id="v_min" type="number" inputmode="decimal" value="'+(s.minimum_amount??"")+'"></div><div><label>Maximum (৳)</label><input id="v_max" type="number" inputmode="decimal" value="'+(s.maximum_amount??"")+'"></div><div><label>Fixed fee (৳)</label><input id="v_fx" type="number" inputmode="decimal" value="'+(s.fixed_fee??0)+'"></div><div><label>Fee (%)</label><input id="v_pc" type="number" inputmode="decimal" value="'+(s.percentage_fee??0)+'"></div></div><label>Short note shown to customers</label><input id="v_ds" value="'+esc(s.description||"")+'"><div class="mut">The app never allows less than ৳500 for deposits and ৳1,000 for withdrawals.</div><div class="acts"><button class="b" id="v_sv">Save</button><button class="b gh" id="v_cx">Close</button></div>');
  const q=i=>sh.querySelector("#"+i);q("v_cx").onclick=closeSheet;
  q("v_sv").onclick=e=>guard(async()=>{await call("admin_update_service",{p_id:s.id,p_min:num(q("v_min").value),p_max:num(q("v_max").value),p_fixed:num(q("v_fx").value),p_pct:num(q("v_pc").value),p_desc:q("v_ds").value});closeSheet();toast("Saved");go("channels")},e.target);
}
function channelForm(c,s){
  c=c||{};
  const sh=sheet('<h2>'+(c.id?"Edit channel":"New channel")+'</h2><label>Name (customers see this)</label><input id="h_nm" value="'+esc(c.channel_name||"")+'"><label>Instructions shown to customers</label><textarea id="h_nt" rows="4" placeholder="e.g. Use Send Money, not Cash Out.">'+esc(c.notes||"")+'</textarea>'+(c.id?'<div class="grid"><div><label>Minimum (৳)</label><input id="h_mn" type="number" inputmode="decimal" value="'+(c.minimum_amount??"")+'"></div><div><label>Maximum (৳)</label><input id="h_mx" type="number" inputmode="decimal" value="'+(c.maximum_amount??"")+'"></div></div>':'')+'<div class="acts"><button class="b" id="h_sv">Save</button><button class="b gh" id="h_cx">Close</button></div>');
  const q=i=>sh.querySelector("#"+i);q("h_cx").onclick=closeSheet;
  q("h_sv").onclick=e=>guard(async()=>{
    if(c.id)await call("admin_update_channel",{p_id:c.id,p_name:q("h_nm").value,p_type:null,p_notes:q("h_nt").value,p_min:num(q("h_mn").value),p_max:num(q("h_mx").value)});
    else await call("admin_add_channel",{p_service:s.id,p_name:q("h_nm").value,p_type:null,p_notes:q("h_nt").value});
    closeSheet();toast("Saved");go("channels");
  },e.target);
}
function accountsSheet(c,all,missing){
  const sh=sheet('<h2>'+esc(c.channel_name)+' · numbers</h2><div class="mut">Customers see one active number. If you add several, they are shared between customers. Agent numbers will appear here later.</div><div id="al" style="margin:10px 0"></div><div class="card"><b>Add a number</b><label>Number</label><input id="n_no" inputmode="tel" placeholder="01XXXXXXXXX"><label>Account name (optional)</label><input id="n_nm"><label>Extra instructions (optional)</label><input id="n_in"><button class="b" id="n_ad">Add number</button></div><div class="acts"><button class="b gh" id="n_cx">Close</button></div>');
  const q=i=>sh.querySelector("#"+i);q("n_cx").onclick=()=>{closeSheet();go("channels")};
  if(missing){q("al").innerHTML='<div class="card">Run supabase_part3.sql in Supabase first.</div>';return}
  let mine=all.filter(a=>a.channel_id===c.id);
  const draw=()=>{
    q("al").innerHTML=mine.length?"":'<p class="mut">No numbers yet. Customers cannot deposit on this channel until you add one.</p>';
    mine.forEach(a=>{
      const d=document.createElement("div");d.className="sw";
      d.innerHTML='<span><b>'+esc(a.account_number)+'</b><br><span class="mut">'+esc(a.owner_type)+(a.account_name?" · "+esc(a.account_name):"")+'</span></span><span style="display:flex;gap:6px"><button class="b '+(a.active?"ok":"gh")+'" data-t="1">'+(a.active?"ON":"OFF")+'</button>'+(a.owner_type==="company"?'<button class="b no" data-d="1">Delete</button>':"")+'</span>';
      d.querySelector("[data-t]").onclick=e=>guard(async()=>{const r=await sb.from("channel_accounts").update({active:!a.active}).eq("id",a.id);if(r.error)throw r.error;a.active=!a.active;draw()},e.target);
      const del=d.querySelector("[data-d]");if(del)del.onclick=e=>guard(async()=>{const r=await sb.from("channel_accounts").delete().eq("id",a.id);if(r.error)throw r.error;mine=mine.filter(x=>x.id!==a.id);all.splice(all.indexOf(a),1);draw()},e.target);
      q("al").appendChild(d);
    });
  };draw();
  q("n_ad").onclick=e=>guard(async()=>{
    const no=q("n_no").value.trim();if(no.length<6)throw new Error("Enter the number.");
    const r=await sb.from("channel_accounts").insert({channel_id:c.id,owner_type:"company",account_number:no,account_name:q("n_nm").value.trim()||null,instructions:q("n_in").value.trim()||null}).select().single();
    if(r.error)throw r.error;mine.push(r.data);all.push(r.data);q("n_no").value="";q("n_nm").value="";q("n_in").value="";draw();toast("Added");
  },e.target);
}

/* ---------- logs ---------- */
views.logs=async m=>{
  const {data,error}=await sb.from("admin_logs").select("*").order("created_at",{ascending:false}).limit(80);
  if(error)throw error;
  await loadNames(data.map(r=>r.admin_id));
  m.innerHTML=data.length?data.map(r=>'<div class="card"><div class="row"><b>'+esc(r.action)+'</b><span class="mut">'+when(r.created_at)+'</span></div><div class="mut">'+esc(r.target||"")+' · by '+nm(r.admin_id)+'</div></div>').join(""):'<p class="mut">No actions yet.</p>';
};


boot();
</script>
