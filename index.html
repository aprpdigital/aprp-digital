<script>

/* =========================================
   APRP DIGITAL - SUPABASE CONFIGURATION
   ========================================= */

const SUPABASE_URL =
  "https://hdlskefeuodhoeaksflq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_wls_WZ6wbLt32s_XRDu9Ug_VndX5ItG";

const APRP_REDIRECT_URL =
  "https://aprpdigital.github.io/aprp-digital/";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   ELEMENTS
   ========================================= */

const authPage =
  document.getElementById("authPage");

const dashboardPage =
  document.getElementById("dashboardPage");

const topbar =
  document.getElementById("topbar");

const bottomNav =
  document.getElementById("bottomNav");

const userName =
  document.getElementById("userName");


/* =========================================
   LOGIN TAB
   ========================================= */

function showLogin() {

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("signupForm")
    .classList.add("hidden");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("signupTab")
    .classList.remove("active");

  clearMessage();
}


/* =========================================
   SIGNUP TAB
   ========================================= */

function showSignup() {

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("signupForm")
    .classList.remove("hidden");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  document
    .getElementById("signupTab")
    .classList.add("active");

  clearMessage();
}


/* =========================================
   MESSAGE
   ========================================= */

function showMessage(text, type) {

  const box =
    document.getElementById("authMessage");

  box.textContent = text;

  box.className =
    "message show " + type;
}


function clearMessage() {

  const box =
    document.getElementById("authMessage");

  box.textContent = "";

  box.className =
    "message";
}


/* =========================================
   LOGIN
   ========================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const button =
        document.getElementById("loginBtn");

      button.disabled = true;
      button.textContent = "Logging in...";

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      button.disabled = false;
      button.textContent = "Login";

      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }

      showMessage(
        "Login successful.",
        "success"
      );

    }
  );


/* =========================================
   SIGNUP
   ========================================= */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const name =
        document
          .getElementById("signupName")
          .value
          .trim();

      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("signupPassword")
          .value;

      const button =
        document.getElementById("signupBtn");

      button.disabled = true;
      button.textContent = "Creating...";

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            },

            emailRedirectTo:
              APRP_REDIRECT_URL

          }

        });

      button.disabled = false;
      button.textContent = "Create Account";

      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }

      if (data.session) {

        showMessage(
          "Account created successfully.",
          "success"
        );

      } else {

        showMessage(
          "Account created. Please check your email to confirm your account.",
          "success"
        );

      }

    }
  );


/* =========================================
   LOAD SESSION
   ========================================= */

async function loadSession() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();

  if (session) {

    showDashboardForUser(
      session.user
    );

  } else {

    showAuth();

  }

}


/* =========================================
   AUTH STATE
   ========================================= */

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    if (session) {

      showDashboardForUser(
        session.user
      );

    } else {

      showAuth();

    }

  }
);


/* =========================================
   SHOW LOGIN PAGE
   ========================================= */

function showAuth() {

  authPage
    .classList
    .remove("hidden");

  dashboardPage
    .classList
    .add("hidden");

  topbar
    .classList
    .add("hidden");

  bottomNav
    .classList
    .add("hidden");
}


/* =========================================
   SHOW DASHBOARD
   ========================================= */

function showDashboardForUser(user) {

  authPage
    .classList
    .add("hidden");

  dashboardPage
    .classList
    .remove("hidden");

  topbar
    .classList
    .remove("hidden");

  bottomNav
    .classList
    .remove("hidden");

  const name =
    user.user_metadata?.full_name ||
    user.email?.split("@")[0] ||
    "User";

  userName.textContent =
    name;
}


/* =========================================
   HOME
   ========================================= */

function showDashboard() {

  dashboardPage
    .classList
    .remove("hidden");

  authPage
    .classList
    .add("hidden");
}


/* =========================================
   LOGOUT
   ========================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  closeDrawer();

  showAuth();
}


/* =========================================
   DRAWER
   ========================================= */

function openDrawer() {

  document
    .getElementById("drawer")
    .classList
    .add("open");
}


function closeDrawer(event) {

  if (
    !event ||
    event.target.id === "drawer"
  ) {

    document
      .getElementById("drawer")
      .classList
      .remove("open");

  }

}


/* =========================================
   START APPLICATION
   ========================================= */

loadSession();

</script>
